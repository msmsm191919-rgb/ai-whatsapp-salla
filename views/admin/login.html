<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المدير — مبهر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0f1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: -30%; right: -20%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(139,92,246,0.12), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -30%; left: -20%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(20,184,166,0.1), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 48px 40px;
            width: 420px;
            max-width: 90vw;
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo i {
            font-size: 40px;
            background: linear-gradient(135deg, #8b5cf6, #14b8a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo h1 {
            font-size: 22px;
            font-weight: 900;
            color: #f1f5f9;
            margin-top: 12px;
        }
        .logo p {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
        }
        .field {
            margin-bottom: 20px;
        }
        .field label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #f1f5f9;
            font-size: 15px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .field input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
        }
        .field input::placeholder {
            color: #475569;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            margin-top: 8px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(139,92,246,0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .error-msg {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .error-msg.show { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <i class="fa-solid fa-shield-halved"></i>
            <h1>لوحة تحكم المدير</h1>
            <p>مبهر AI — الدخول للمسؤولين فقط</p>
        </div>

        <div class="error-msg {% if error %}show{% endif %}" id="errorMsg">
            {{ error or 'بيانات الدخول غير صحيحة' }}
        </div>

        <form method="POST" action="/admin/login">
            <div class="field">
                <label><i class="fa-solid fa-envelope"></i> البريد الإلكتروني</label>
                <input type="email" name="email" placeholder="admin@example.com" required autocomplete="email">
            </div>
            <div class="field">
                <label><i class="fa-solid fa-lock"></i> كلمة المرور</label>
                <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                تسجيل الدخول
            </button>
        </form>
    </div>
</body>
</html>
