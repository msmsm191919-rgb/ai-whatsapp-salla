<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التاجر المستقل | قريباً | مبهر AI</title>
  <meta name="description" content="تجربة التاجر المستقل في مبهر AI قيد التجهيز وستكون متاحة قريباً">
  <script src="/js/tailwind.js"></script>
  <link href="/css/all.min.css" rel="stylesheet">
  <link href="/css/fonts.css" rel="stylesheet">
  <style>
    :root{--c1:#06d6a0;--c2:#118ab2;--c3:#7b2ff7;--dark:#030712;--card:rgba(255,255,255,.03);--border:rgba(255,255,255,.08)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;overflow-x:hidden}

    body{
      font-family:'Cairo',sans-serif;
      background:var(--dark);color:#fff;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      font-size:14px;
      line-height:1.6;
    }

    h1,h2,h3,h4,h5,h6{font-family:'Cairo',sans-serif;font-weight:900;}
    .num,.ltr,[dir="ltr"],time,code{font-family:'Inter',sans-serif;}

    .glass{background:var(--card);border:1px solid var(--border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .gt{background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

    .glow-btn{
      background:linear-gradient(135deg,var(--c1),var(--c2));
      position:relative;overflow:hidden;transition:all .25s;
      font-weight:800;
    }
    .glow-btn::before{content:'';position:absolute;inset:-2px;background:linear-gradient(135deg,var(--c1),var(--c2));filter:blur(15px);opacity:0;transition:opacity .25s;z-index:-1}
    .glow-btn:hover::before{opacity:.5}
    .glow-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(6,214,160,.25)}

    @keyframes morph{0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%}50%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%}}
    .morph-blob{animation:morph 8s ease-in-out infinite;}
    .grid-bg{background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse at center,black 20%,transparent 70%);mask-image:radial-gradient(ellipse at center,black 20%,transparent 70%)}
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative">

  <!-- Background Ambience -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] morph-blob opacity-20" style="background:radial-gradient(circle,rgba(17,138,178,.4),transparent 70%);filter:blur(80px)"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-[450px] h-[450px] morph-blob opacity-15" style="background:radial-gradient(circle,rgba(6,214,160,.3),transparent 70%);filter:blur(80px)"></div>
    <div class="absolute inset-0 grid-bg"></div>
  </div>

  <!-- Header -->
  <header class="w-full z-20 pt-4 px-4">
    <div class="max-w-6xl mx-auto">
      <div class="glass rounded-2xl px-5 py-2.5 flex items-center justify-between shadow-xl">
        <a href="/" class="flex items-center gap-0 group text-decoration-none">
          <div class="relative">
            <div class="absolute inset-0 bg-[var(--c1)]/20 rounded-xl blur-md group-hover:bg-[var(--c1)]/30 transition"></div>
            <div class="relative w-11 h-11 flex items-center justify-center">
              <img src="/salla-assets/salla_app_icon_512_transparent_white.png" alt="مبهر AI" class="w-full h-full object-contain">
            </div>
          </div>
          <span class="text-lg font-black tracking-tight text-white -mr-1">مبهر <span class="gt">AI</span></span>
        </a>
        <a href="/" class="text-xs font-bold text-gray-400 hover:text-white flex items-center gap-2 transition px-3 py-1.5 rounded-xl hover:bg-white/5 border border-transparent hover:border-white/10 text-decoration-none">
          <span>العودة للرئيسية</span>
          <i class="fas fa-arrow-left text-[10px]"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content (Coming Soon) -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 z-10 my-8">
    <div class="w-full max-w-md">
      
      <!-- Card -->
      <div class="glass rounded-3xl p-8 sm:p-10 border border-white/10 shadow-2xl relative overflow-hidden text-center" style="background: rgba(10, 22, 40, 0.95);">
        <!-- Card Glow -->
        <div class="absolute -top-20 -right-20 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Platform Icon -->
        <div class="w-20 h-20 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center p-4 text-amber-300 mx-auto mb-5 shadow-lg shadow-amber-900/20">
          <img src="/images/platforms/standalone.svg" alt="مستقل" class="w-10 h-10 object-contain opacity-80">
        </div>

        <!-- Badge -->
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-black mb-3">
          <i class="fa-solid fa-clock text-[11px]"></i>
          <span>قريباً</span>
        </div>

        <!-- Title -->
        <h1 class="text-2xl sm:text-3xl font-black text-white mb-3">التاجر المستقل</h1>

        <!-- Description -->
        <p class="text-sm text-gray-300 leading-relaxed mb-8">
          نعمل حالياً على تجهيز تجربة التاجر المستقل في مبهر. ستكون متاحة قريباً.
        </p>

        <!-- CTA Button -->
        <div class="space-y-3">
          <a href="/" class="glow-btn w-full py-3.5 px-6 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 text-decoration-none shadow-lg">
            <span>العودة للرئيسية</span>
            <i class="fas fa-arrow-left text-[10px]"></i>
          </a>
          <a href="/connect/salla" class="block w-full py-2.5 px-4 text-xs font-bold text-gray-400 hover:text-emerald-300 transition text-decoration-none">
            هل أنت تاجر سلة؟ اضغط هنا للدخول عبر سلة ←
          </a>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="w-full py-4 text-center text-xs text-gray-500 border-t border-white/5 z-10">
    <p>© 2026 مبهر AI — جميع الحقوق محفوظة للمتاجر الإلكترونية</p>
  </footer>

</body>
</html>
