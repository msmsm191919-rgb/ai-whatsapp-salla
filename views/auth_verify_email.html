<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحقق من بريدك الإلكتروني | مبهر AI</title>
  <script src="/js/tailwind.js"></script>
  <link href="/css/all.min.css" rel="stylesheet">
  <link href="/css/fonts.css" rel="stylesheet">
  <style>
    :root{--c1:#06d6a0;--c2:#118ab2;--c3:#7b2ff7;--dark:#030712;--card:rgba(255,255,255,.03);--border:rgba(255,255,255,.08)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Cairo',sans-serif;background:var(--dark);color:#fff;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
    .glass{background:var(--card);border:1px solid var(--border);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);}
    .gt{background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .glow-btn{background:linear-gradient(135deg,var(--c1),var(--c2));font-weight:800;transition:all .25s;}
    .glow-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(6,214,160,.25)}
    @keyframes morph{0%,100%{border-radius:60% 40% 30% 70%/60% 30% 70% 40%}50%{border-radius:30% 60% 70% 40%/50% 60% 30% 60%}}
    .morph-blob{animation:morph 8s ease-in-out infinite;}
    .grid-bg{background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse at center,black 20%,transparent 70%);mask-image:radial-gradient(ellipse at center,black 20%,transparent 70%)}
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative p-4">

  <!-- Background Ambience -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] morph-blob opacity-20" style="background:radial-gradient(circle,rgba(17,138,178,.4),transparent 70%);filter:blur(80px)"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-[450px] h-[450px] morph-blob opacity-15" style="background:radial-gradient(circle,rgba(6,214,160,.3),transparent 70%);filter:blur(80px)"></div>
    <div class="absolute inset-0 grid-bg"></div>
  </div>

  <!-- Header -->
  <header class="w-full max-w-6xl mx-auto pt-2 z-10">
    <div class="glass rounded-2xl px-5 py-2.5 flex items-center justify-between shadow-xl">
      <a href="/" class="flex items-center gap-0 text-decoration-none">
        <div class="relative w-11 h-11 flex items-center justify-center">
          <img src="/salla-assets/salla_app_icon_512_transparent_white.png" alt="مبهر AI" class="w-full h-full object-contain">
        </div>
        <span class="text-lg font-black text-white -mr-1">مبهر <span class="gt">AI</span></span>
      </a>
      <a href="/auth/standalone" class="text-xs text-gray-400 hover:text-white font-bold text-decoration-none px-3 py-1.5 rounded-xl hover:bg-white/5 border border-transparent hover:border-white/10 transition">
        تسجيل الدخول
      </a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex items-center justify-center my-6 z-10">
    <div class="w-full max-w-md">
      <div class="glass rounded-3xl p-6 sm:p-8 border border-white/10 shadow-2xl relative text-center" style="background: rgba(10, 22, 40, 0.95);">
        
        <div class="w-16 h-16 rounded-2xl bg-teal-500/20 text-teal-300 flex items-center justify-center mx-auto mb-4 text-2xl">
          <i class="fas fa-envelope-open-text"></i>
        </div>

        <h1 class="text-xl font-black text-white mb-2">تحقق من بريدك الإلكتروني</h1>
        <p class="text-xs text-gray-300 leading-relaxed mb-4">
          أرسلنا رابط التحقق إلى بريدك الإلكتروني.
        </p>

        <div class="p-3 rounded-xl bg-white/5 border border-white/10 text-xs font-bold text-teal-300 mb-5 text-left font-mono" id="target-email" dir="ltr">
          {{ email or 'owner@elegancestore.sa' }}
        </div>

        <div class="space-y-3">
          <button type="button" onclick="alert('تمت إعادة إرسال رابط التحقق بنجاح!')" class="glow-btn w-full py-3 px-4 text-white rounded-xl text-xs font-bold border-0 cursor-pointer">
            إعادة إرسال رابط التحقق
          </button>
          <a href="/auth/standalone?mode=register" class="block w-full py-2 text-xs font-bold text-gray-400 hover:text-white text-decoration-none">
            تغيير البريد الإلكتروني
          </a>
        </div>

        <div class="mt-6 pt-4 border-t border-white/10">
          <a href="/auth/standalone/payment-setup" class="text-xs font-bold text-teal-300 hover:underline">
            المتابعة لإضافة وسيلة الدفع وتفعيل التجربة ←
          </a>
        </div>

      </div>
    </div>
  </main>

  <footer class="w-full py-3 text-center text-xs text-gray-500 border-t border-white/5 z-10">
    <p>© 2026 مبهر AI — جميع الحقوق محفوظة للمتاجر الإلكترونية</p>
  </footer>
</body>
</html>
